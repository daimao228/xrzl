<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌游小站</title>
<style>
  :root { --bg:#f3ede2; --ink:#241d2b; --muted:#6b6270; --gold:#96700f; --line:rgba(94,78,58,.22); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; padding:26px 16px;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(rgba(255,251,244,.55), rgba(255,251,244,.8)),
               radial-gradient(900px 500px at 50% -10%, #e7d9bd, transparent 65%),
               var(--bg);
  }
  .wrap { width:min(96vw, 560px); }
  h1 {
    font-family:"Songti SC","STSong",Georgia,serif;
    font-size:26px; letter-spacing:10px; text-align:center;
    margin:0 0 6px; color:var(--gold); font-weight:700;
  }
  .sub { text-align:center; font-size:10.5px; letter-spacing:2px; color:var(--muted); margin-bottom:22px; }
  .grid { display:grid; gap:10px; }
  a.card {
    display:flex; align-items:center; gap:12px;
    padding:16px 16px; border-radius:14px; text-decoration:none; color:inherit;
    background:rgba(255,255,255,.78); border:1px solid var(--line);
    box-shadow:0 8px 20px rgba(70,50,25,.08);
    transition:.16s;
  }
  a.card:hover { border-color:rgba(184,134,11,.6); transform:translateY(-1px); box-shadow:0 12px 26px rgba(70,50,25,.14); }
  a.card .ico { font-size:28px; width:38px; text-align:center; flex-shrink:0; }
  a.card b { display:block; font-size:15px; letter-spacing:1px; margin-bottom:3px; }
  a.card span { font-size:11.5px; color:var(--muted); line-height:1.5; }
  a.card .go { margin-left:auto; font-size:12px; color:var(--gold); flex-shrink:0; }
  a.card.small { padding:12px 16px; }
  a.card.small .ico { font-size:22px; width:32px; }
  a.card.small b { font-size:13.5px; }
  a.card.small .go { display:none; }
  .note {
    margin-top:18px; padding-top:14px; border-top:1px dashed var(--line);
    font-size:11px; line-height:1.8; color:var(--muted);
  }
  .note code { background:rgba(150,112,15,.1); padding:1px 5px; border-radius:4px; font-size:10.5px; }
  .ver { text-align:center; font-size:10px; color:#9a9186; margin-top:14px; letter-spacing:.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>桌 游 小 站</h1>
  <div class="sub">BLOOD ON THE CLOCKTOWER &nbsp;·&nbsp; KAKERLAKENPOKER</div>

  <div class="grid">
    <a class="card" data-page="botc" href="botc/">
      <div class="ico">🩸</div>
      <div><b>血染钟楼</b><span>说书人端 / 玩家端 / 旁观端，房间号一键分发</span></div>
      <div class="go">进入 →</div>
    </a>

    <a class="card" data-page="dgzl" href="dgzl/">
      <div class="ico">🪳</div>
      <div><b>德国蟑螂</b><span>单机版：一台设备大家轮流拖牌</span></div>
      <div class="go">进入 →</div>
    </a>

    <a class="card small" data-page="dgzl/online" href="dgzl/online">
      <div class="ico">📶</div>
      <div><b>德国蟑螂 · 联机版</b><span>每人一台设备，同一房间号自动同步</span></div>
    </a>

    <a class="card small" data-page="botc/lobby" href="botc/lobby">
      <div class="ico">🎪</div>
      <div><b>游戏大厅</b><span>填一次名字和房间号，两种游戏都免登录</span></div>
    </a>
  </div>

  <div class="note">
    房间号用 <code>#room=xxx</code> 传递（帽子云会把 <code>?查询</code> 变成 404）。<br>
    目录重整后旧地址（<code>/dm</code>、<code>/player</code>、<code>/dgzl</code>…）已换成
    <code>/botc/…</code>、<code>/dgzl/…</code>，从上面重新进即可。
  </div>
  <div class="ver" id="ver"></div>
</div>

<script>
(function () {
  var isFile = location.protocol === 'file:';
  var hash = location.hash || '';
  var links = document.querySelectorAll('a[data-page]');
  for (var i = 0; i < links.length; i++) {
    var p = links[i].getAttribute('data-page');
    if (isFile) p = (p.slice(-1) === '/') ? (p + 'index.html') : (p + '.html');
    links[i].href = p + hash;
  }
  document.getElementById('ver').textContent = 'xrzl · ' + location.pathname;
})();
</script>
</body>
</html>

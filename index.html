<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌游小站</title>
<style>
  :root { --bg:#f3ede2; --ink:#241d2b; --muted:#6b6270; --gold:#96700f; --line:rgba(94,78,58,.22); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; padding:28px 16px;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(rgba(255,251,244,.55), rgba(255,251,244,.8)),
               radial-gradient(900px 500px at 50% -10%, #e7d9bd, transparent 65%),
               var(--bg);
  }
  .wrap { width:min(96vw, 460px); }
  h1 {
    font-family:"Songti SC","STSong",Georgia,serif;
    font-size:27px; letter-spacing:10px; text-align:center;
    margin:0 0 6px; color:var(--gold); font-weight:700;
  }
  .sub { text-align:center; font-size:10.5px; letter-spacing:2px; color:var(--muted); margin-bottom:24px; }
  .grid { display:grid; gap:12px; }
  a.card {
    display:flex; align-items:center; gap:14px;
    padding:20px 18px; border-radius:16px; text-decoration:none; color:inherit;
    background:rgba(255,255,255,.8); border:1px solid var(--line);
    box-shadow:0 10px 24px rgba(70,50,25,.09);
    transition:.16s;
  }
  a.card:hover { border-color:rgba(184,134,11,.62); transform:translateY(-2px); box-shadow:0 16px 32px rgba(70,50,25,.15); }
  a.card .ico { font-size:34px; width:46px; text-align:center; flex-shrink:0; }
  a.card b { display:block; font-size:16px; letter-spacing:1px; margin-bottom:4px; }
  a.card span { font-size:11.5px; color:var(--muted); line-height:1.5; }
  a.card .go { margin-left:auto; font-size:13px; color:var(--gold); flex-shrink:0; }
  .note {
    margin-top:20px; padding-top:14px; border-top:1px dashed var(--line);
    font-size:11px; line-height:1.8; color:var(--muted); text-align:center;
  }
  .note code { background:rgba(150,112,15,.1); padding:1px 5px; border-radius:4px; font-size:10.5px; }
  .ver { text-align:center; font-size:10px; color:#9a9186; margin-top:14px; letter-spacing:.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>桌 游 小 站</h1>
  <div class="sub">BLOOD ON THE CLOCKTOWER &nbsp;·&nbsp; KAKERLAKENPOKER</div>

  <div class="grid">
    <a class="card" data-page="botc/lobby" href="botc/lobby">
      <div class="ico">🎪</div>
      <div><b>游戏大厅</b><span>登录账号 → 选游戏 → 输房间号进入</span></div>
      <div class="go">进入 →</div>
    </a>

    <a class="card" data-page="botc/dm" href="botc/dm">
      <div class="ico">🎩</div>
      <div><b>血染钟楼 · 说书人端</b><span>只有主持人自己用，需要说书人密码</span></div>
      <div class="go">进入 →</div>
    </a>
  </div>

  <div class="note">
    房间号用 <code>#room=xxx</code> 传递（帽子云会把 <code>?查询</code> 变成 404）。
  </div>
  <div class="ver" id="ver"></div>
</div>

<script>
(function () {
  var isFile = location.protocol === 'file:';
  var hash = location.hash || '';
  var links = document.querySelectorAll('a[data-page]');
  for (var i = 0; i < links.length; i++) {
    var p = links[i].getAttribute('data-page');
    if (isFile) p += '.html';
    links[i].href = p + hash;
  }
  document.getElementById('ver').textContent = 'xrzl · ' + location.pathname;
})();
</script>
</body>
</html>

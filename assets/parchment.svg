<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="none">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="burn" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#f2e6c8" stop-opacity="0"/>
      <stop offset="62%" stop-color="#b89a63" stop-opacity="0.18"/>
      <stop offset="92%" stop-color="#6d5033" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4a321f" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="tone" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#efe2c4"/>
      <stop offset="55%" stop-color="#e3d2ac"/>
      <stop offset="100%" stop-color="#d6c096"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#tone)"/>
  <rect width="1200" height="800" filter="url(#grain)"/>
  <rect width="1200" height="800" fill="url(#burn)"/>
</svg>
